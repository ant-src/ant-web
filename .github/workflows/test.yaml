name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ant-web
          persist-credentials: false
      # ant.wasm is built from the ant repository's default branch, next to this one.
      - uses: actions/checkout@v5
        with:
          repository: ant-src/ant
          path: ant
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: ant/go.mod
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: install
        working-directory: ant-web
        run: npm ci
      - name: format
        working-directory: ant-web
        run: npm run fmt:check
      - name: lint
        working-directory: ant-web
        run: npm run lint
      - name: build
        working-directory: ant-web
        run: npm run build
      - name: test
        working-directory: ant-web
        run: npm test
      - name: playground
        working-directory: ant-web
        run: npm run build -w playground
      - name: pack
        working-directory: ant-web
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          npm pack -w @ant-lang/wasm -w @ant-lang/monaco --pack-destination "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*.tgz
