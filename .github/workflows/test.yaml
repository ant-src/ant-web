name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ant-web
          persist-credentials: false
      # ant.wasm is built from the ant repository, next to this one. A release tag builds from the ant
      # release that packages/wasm/package.json pins in its "ant" field, and fails when ant has no
      # such tag; anything else builds from ant's default branch, so a change there that breaks
      # ant-web shows up early.
      - name: ant ref
        id: ant
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          ref=
          if [ "$REF_TYPE" = tag ]; then
            ref=$(jq -r .ant ant-web/packages/wasm/package.json)
            case $ref in
              v[0-9]*) ;;
              *) echo "packages/wasm/package.json \"ant\" is $ref, not an ant release tag" >&2; exit 1 ;;
            esac
            if ! git ls-remote --exit-code --tags https://github.com/ant-src/ant "refs/tags/$ref" >/dev/null; then
              echo "ant has no tag $ref (packages/wasm/package.json \"ant\")" >&2
              exit 1
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ant-src/ant
          ref: ${{ steps.ant.outputs.ref }}
          path: ant
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ant/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: install
        working-directory: ant-web
        run: npm ci
      - name: build
        working-directory: ant-web
        run: npm run build
      - name: test
        working-directory: ant-web
        run: npm test
      - name: playground
        working-directory: ant-web
        run: npm run build -w playground

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ant-web
          persist-credentials: false
      # A release tag builds from the ant release pinned in packages/wasm/package.json ("ant");
      # anything else from ant's default branch.
      - name: ant ref
        id: ant
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          ref=
          if [ "$REF_TYPE" = tag ]; then
            ref=$(jq -r .ant ant-web/packages/wasm/package.json)
            case $ref in
              v[0-9]*) ;;
              *) echo "packages/wasm/package.json \"ant\" is $ref, not an ant release tag" >&2; exit 1 ;;
            esac
            if ! git ls-remote --exit-code --tags https://github.com/ant-src/ant "refs/tags/$ref" >/dev/null; then
              echo "ant has no tag $ref (packages/wasm/package.json \"ant\")" >&2
              exit 1
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ant-src/ant
          ref: ${{ steps.ant.outputs.ref }}
          path: ant
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ant/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: install
        working-directory: ant-web
        run: npm ci
      # npm pack builds each package first, with its prepack script.
      - name: pack
        working-directory: ant-web
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          npm pack -w @ant-lang/wasm -w @ant-lang/monaco --pack-destination "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*.tgz
