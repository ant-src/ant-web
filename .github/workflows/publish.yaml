name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  check:
    uses: ./.github/workflows/check.yaml

  test:
    uses: ./.github/workflows/test.yaml

  publish:
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages-dist
      - name: version
        run: |
          for pkg in packages/wasm packages/monaco; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "tag $GITHUB_REF_NAME does not match $pkg/package.json version $version"
              exit 1
            fi
          done
      # Trusted publishing: npm takes the workflow's OIDC token, and adds provenance.
      # @ant-lang/monaco depends on @ant-lang/wasm, so wasm goes first.
      - name: npm
        run: |
          npm publish ./packages-dist/ant-lang-wasm-*.tgz --access public
          npm publish ./packages-dist/ant-lang-monaco-*.tgz --access public
      - name: release
        run: gh release create "$GITHUB_REF_NAME" ./packages-dist/*.tgz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
